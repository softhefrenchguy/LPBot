services:
  lpbot:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/heartbeat.txt && [ $(( $(date +%s) - $(cat /tmp/heartbeat.txt) )) -lt 180 ]"]
      interval: 60s
      timeout: 10s
      retries: 3
